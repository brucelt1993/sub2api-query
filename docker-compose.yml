version: '3.8'

services:
  query-service:
    build: .
    container_name: sub2api-query
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      # 可以通过环境变量覆盖配置
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8086
      - AUTH_ACCESS_TOKEN=your-secret-token-change-me-in-production
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  sub2api-network:
    driver: bridge
